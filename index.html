<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sverige online</title>
<script>
// Sätt tema före rendering så sidan inte blinkar
(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff5;--card:#fff;--ink:#141a2b;--dim:#5f6882;--line:#dfe3ee;--ok:#12a066;--warn:#d98a0b;--bad:#d9394b;--okbg:#e2f6ec;--warnbg:#fdf0d8;--badbg:#fde4e7;--hero:#1b2340;--herotxt:#fff}
:root[data-theme=dark]{--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--dim:#8d98b8;--line:#27324f;--ok:#3ecf94;--warn:#f0b24a;--bad:#f2697a;--okbg:#14352f;--warnbg:#3b2f17;--badbg:#3d1d2a;--hero:#1e2a4e;--herotxt:#fff}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;transition:background .2s,color .2s}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.sum b{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top strong{font:700 18px "Bricolage Grotesque",sans-serif}
.tog{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.tog button{border:0;background:none;color:var(--dim);font:500 13px Figtree,sans-serif;padding:6px 14px;border-radius:99px;cursor:pointer}
.tog button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

.hero{background:var(--hero);color:var(--herotxt);border-radius:18px;padding:28px;margin-bottom:18px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 0;opacity:.75}
.sum{display:flex;gap:10px}
.sum div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;text-align:center;min-width:84px}
.sum b{display:block;font-size:28px;line-height:1.1}
.sum span{font-size:12px;opacity:.75}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px 10px}
.card.drag{opacity:.45;border-style:dashed}
.card header{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.card h2{margin:0;font-size:18px;font-weight:700;flex:1}
.grip{border:0;background:none;color:var(--dim);cursor:grab;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.grip:hover{background:var(--bg)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line)}
.line{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.name{flex:1;font-weight:500}
.ms{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:2px;height:16px}
.bars i{flex:1;border-radius:2px;background:var(--ok);opacity:.85}
.bars i.none{background:var(--line);opacity:1}.bars i.warn{background:var(--warn)}.bars i.bad{background:var(--bad)}
.foot{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:3px}
.note{margin-top:22px;color:var(--dim);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <strong>Sverige online</strong>
    <div class="tog" role="group" aria-label="Färgtema">
      <button id="bLight" aria-pressed="false">Ljust</button>
      <button id="bDark" aria-pressed="false">Mörkt</button>
    </div>
  </div>

  <section class="hero" aria-live="polite">
    <div><h1 id="headline">Hämtar status…</h1><p id="sub"></p></div>
    <div class="sum">
      <div><b id="nOk">0</b><span>fungerar</span></div>
      <div><b id="nWarn">0</b><span>långsamma</span></div>
      <div><b id="nBad">0</b><span>nere</span></div>
    </div>
  </section>

  <main class="grid" id="grid"></main>
  <p class="note">Status visar om varje webbplats svarar, inte att inloggade tjänster fungerar. Dra i handtaget ⠿ för att flytta kort, eller fokusera det och använd piltangenterna.</p>
</div>

<script>
// ---------- DATA OCH RENDER ----------
const pillTxt={ok:"Allt fungerar",warn:"Störning",bad:"Problem"};
const grid=document.getElementById("grid");
const worst=items=>items.some(i=>i.state==="bad")?"bad":items.some(i=>i.state==="warn")?"warn":"ok";
const tot=c=>c[0]+c[1]+c[2];
// Dag räknas som nere vid >=2 % misslyckade kontroller, störning vid >=5 % misslyckade eller långsamma
const dayState=c=>!tot(c)?"none":c[2]/tot(c)>=.02?"bad":(c[1]+c[2])/tot(c)>=.05?"warn":"ok";
function bars(it){return Array.from({length:30},(_,k)=>{const d=new Date(Date.now()-(29-k)*864e5).toISOString().slice(0,10);return dayState(it.days[d]||[0,0,0])})}
function uptime(it){let t=0,u=0;for(const c of Object.values(it.days)){t+=tot(c);u+=c[0]+c[1]}return t?(u/t*100).toFixed(1).replace(".",",")+" % tillgänglig":"ingen historik än"}

function card(g){
  const el=document.createElement("article");
  el.className="card";el.dataset.id=g.id;
  const w=worst(g.items);
  el.innerHTML=`<header>
    <button class="grip" aria-label="Flytta kortet ${g.title}" title="Dra för att flytta">⠿</button>
    <h2>${g.title}</h2><span class="pill ${w}">${pillTxt[w]}</span></header>
    <ul>${g.items.map(i=>`<li>
      <div class="line"><span class="dot ${i.state}"></span><span class="name">${i.name}</span>
      <span class="ms">${i.state==="bad"?"svarar inte":i.ms+" ms"}</span></div>
      <div class="bars" role="img" aria-label="Historik 30 dagar för ${i.name}">${bars(i).map(s=>`<i class="${s==="ok"?"":s}"></i>`).join("")}</div>
      <div class="foot"><span>${uptime(i)}</span><span>idag</span></div></li>`).join("")}</ul>`;
  return el;
}

function render(data){
  if(grid.querySelector(".drag"))return; // flytta inte om kort mitt i en dragning
  grid.innerHTML="";
  data.groups.forEach(g=>grid.appendChild(card(g)));
  try{JSON.parse(localStorage.getItem("order")||"[]").forEach(id=>{const e=grid.querySelector(`[data-id="${id}"]`);if(e)grid.appendChild(e)})}catch(e){}
  const all=data.groups.flatMap(g=>g.items), c=s=>all.filter(i=>i.state===s).length;
  nOk.textContent=c("ok");nWarn.textContent=c("warn");nBad.textContent=c("bad");
  const bad=c("bad"),warn=c("warn");
  headline.textContent=bad?`${bad} ${bad===1?"tjänst är":"tjänster är"} nere`:warn?"Vissa tjänster är långsamma":"Allt fungerar";
  const age=Math.round((Date.now()-new Date(data.updated))/6e4);
  sub.textContent=`${all.length} tjänster kontrollerade · uppdaterad ${new Date(data.updated).toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}`+(age>20?` · obs, senaste kontrollen är ${age} min gammal`:"");
}

async function load(){
  try{
    const r=await fetch("status.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    render(await r.json());
  }catch(e){
    if(!grid.children.length){
      headline.textContent="Ingen statusdata än";
      sub.textContent="Kunde inte läsa status.json. Kör check.mjs och öppna sidan via en lokal server, inte direkt som fil.";
    }
  }
}
load();setInterval(load,60000);

// ---------- FLYTTBARA KORT ----------
const save=()=>{try{localStorage.setItem("order",JSON.stringify([...grid.children].map(e=>e.dataset.id)))}catch(e){}};
try{const o=JSON.parse(localStorage.getItem("order")||"[]");o.forEach(id=>{const e=grid.querySelector(`[data-id="${id}"]`);if(e)grid.appendChild(e)})}catch(e){}

let dragging=null;
grid.addEventListener("pointerdown",e=>{const g=e.target.closest(".grip");if(g)g.closest(".card").draggable=true});
grid.addEventListener("dragstart",e=>{dragging=e.target.closest(".card");if(!dragging)return;dragging.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","")});
grid.addEventListener("dragover",e=>{
  if(!dragging)return;e.preventDefault();
  const t=e.target.closest(".card");if(!t||t===dragging)return;
  const r=t.getBoundingClientRect();
  const after=e.clientY>r.top+r.height/2;
  grid.insertBefore(dragging,after?t.nextSibling:t);
});
grid.addEventListener("dragend",()=>{if(dragging){dragging.classList.remove("drag");dragging.draggable=false;dragging=null;save()}});
// Tangentbord: piltangenter på handtaget
grid.addEventListener("keydown",e=>{
  const g=e.target.closest(".grip");if(!g)return;
  const card=g.closest(".card");
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){if(card.previousElementSibling)grid.insertBefore(card,card.previousElementSibling)}
  else if(e.key==="ArrowRight"||e.key==="ArrowDown"){if(card.nextElementSibling)grid.insertBefore(card.nextElementSibling,card)}
  else return;
  e.preventDefault();g.focus();save();
});

// ---------- TEMA ----------
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}
  bLight.setAttribute("aria-pressed",t==="light");bDark.setAttribute("aria-pressed",t==="dark")}
bLight.onclick=()=>setTheme("light");bDark.onclick=()=>setTheme("dark");
setTheme(document.documentElement.dataset.theme);
</script>
</body>
</html>
